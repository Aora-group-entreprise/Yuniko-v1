name: Yuniko global final CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: yuniko-global-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  global-ci:
    name: Full project validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout entire Yuniko-v1 project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install all dependencies
        run: npm install

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build and TypeScript validation
        run: npm run build

      - name: Unit, algorithm and integration tests
        run: npm run test:unit

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Full E2E application flows
        run: npm run test:e2e
